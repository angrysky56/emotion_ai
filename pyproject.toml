[project]
name = "aura-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "asyncio-mqtt>=0.16.2",
    "chromadb>=1.5.8",
    "faiss-cpu>=1.11.0",
    "faiss-gpu-cu12>=1.11.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "numpy>=2.0.0",
    "openai>=1.86.0",
    "pydantic>=2.13.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "pyzbar>=0.1.9",
    "sentence-transformers>=3.3.1",
    "torch==2.11.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
provider-gemini = ["google-genai==1.75.0"]
mcp = ["mcp==1.27.0", "fastmcp==3.2.4"]
memvid = ["memvid-sdk==2.0.159"]

[dependency-groups]
dev = ["ruff==0.12.7"]

[tool.pyright]
include = ["aura_backend"]
exclude = ["src"]
extraPaths = ["."]
typeCheckingMode = "basic"

[tool.ruff]
src = ["aura_backend", "."]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
markers = [
    "live: requires an explicitly available external service",
    "ollama: requires a running Ollama service and installed model",
    "gpu: requires compatible GPU hardware and drivers",
]
